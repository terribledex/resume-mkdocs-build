# Автоматическое обновление зависимостей через Dependabot

version: 2
updates:
  # Обновления Python пакетов
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "terribledex"  # Замените на ваш GitHub username
    assignees:
      - "terribledex"  # Замените на ваш GitHub username
    commit-message:
      prefix: "⬆️"
      prefix-development: "⬆️ dev"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    
  # Обновления GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "terribledex"  # Замените на ваш GitHub username
    assignees:
      - "terribledex"  # Замените на ваш GitHub username
    commit-message:
      prefix: "⬆️"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"