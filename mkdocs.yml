site_name: Богоподобное резюме
site_description: Это я
site_author: etozhedex
site_url: https://terribledex.github.io/resume/

repo_name: terribledex/resume
repo_url: https://github.com/terribledex/resume

theme:
  name: material
  custom_dir: overrides
  palette:
    # Catppuccin Latte с фиолетовым оттенком
    - media: "(prefers-color-scheme: light)"
      scheme: catppuccin-latte-purple
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    # Catppuccin Frappe с фиолетовым оттенком
    - media: "(prefers-color-scheme: dark)"
      scheme: catppuccin-frappe-purple
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - toc.follow
    - toc.integrate
  
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    logo: material/heart
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

plugins:
  - search:
      lang: ru
  - minify:
      minify_html: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - abbr

nav:
  - 🏠 Главная: index.md
  - 🥇 Не главная: about.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/terribledex
      name: GitHub
    - icon: fontawesome/brands/telegram
      link: https://t.me/etozhedex  
      name: Telegram
    - icon: fontawesome/solid/envelope
      link: mailto:etozhedex@ya.ru
      name: Email
  
  generator: false

extra_css:
  - stylesheets/catppuccin-purple.css
  - stylesheets/animations.css
  - stylesheets/cute-theme.css

extra_javascript:
  - javascripts/animations.js
  - javascripts/scroll-effects.js
  - javascripts/section-slider.js

copyright: |
  <div class="copyright-container">
    <span>Copyright &copy; 2025 etozhedex   </span>
    <span class="made-with">Создано с ❤️ и MkDocs Material</span>
  </div>